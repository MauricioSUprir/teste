<!doctype html>
<html lang="pt-BR">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap">
<link rel="stylesheet" href="tema/gideon-tema.css">
<style>
  /* GIDEON Core (módulos 61 + 100, decisão 024): núcleo 3D no centro; GIDEON LAB, NEURAL LAB e WORLD LAB em órbita.
     Cada parte abre um painel que funciona de verdade (dados reais do Nexus e da função gideon). */
  :root { --fundo:var(--g-fundo); --painel:rgba(8,11,31,.92); --borda:var(--g-borda); --texto:var(--g-texto); --suave:var(--g-texto-3); --destaque:var(--g-acento-claro); --link:var(--g-acento);
    --ok:var(--g-ok); --aviso:var(--g-aviso); --erro:var(--g-erro); --gideon:#2fc6ff; --neural:#5b9bff; --world:#2fe0b0; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--fundo); color:var(--texto); overflow:hidden;
    font:15px/1.5 var(--g-fonte); -webkit-tap-highlight-color:transparent; }
  #cena { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; outline:none; }
  #cena.arrastando { cursor:grabbing; }
  #vinheta { position:fixed; inset:0; z-index:1; pointer-events:none; background:radial-gradient(ellipse 75% 70% at 50% 48%, transparent 45%, rgba(0,0,0,.72) 100%); }
  a { color:var(--link); }
  button { font:inherit; color:inherit; }

  header { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    padding:max(12px, env(safe-area-inset-top)) 16px 0; pointer-events:none; z-index:3; }
  header h1 { margin:6px 0 0; font:800 16px/1.1 var(--g-fonte-titulo); letter-spacing:.22em; color:var(--g-texto); }
  header h1 em { font-style:italic; color:var(--g-acento); }
  header .sub { color:var(--suave); font:600 10.5px var(--g-fonte-titulo); letter-spacing:.2em; text-transform:uppercase; margin-top:3px; }
  #estadoSistema { pointer-events:auto; font-size:12px; letter-spacing:.08em; color:var(--suave); border:1px solid var(--borda); border-radius:999px;
    padding:4px 10px; background:rgba(4,10,18,.6); white-space:nowrap; cursor:pointer; }
  #estadoSistema .bola { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--suave); margin-right:6px; vertical-align:middle; }
  #estadoSistema.ok .bola { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  #estadoSistema.atencao .bola { background:var(--aviso); box-shadow:0 0 8px var(--aviso); }

  /* rótulos que acompanham as peças 3D */
  .rotulo { position:fixed; left:0; top:0; z-index:2; transform:translate(-50%, 0); pointer-events:auto; cursor:pointer; white-space:nowrap; font-family:var(--g-fonte-titulo); font-weight:700;
    background:rgba(4,10,18,.55); border:1px solid var(--borda); border-radius:999px; padding:3px 11px; font-size:11px; letter-spacing:.2em;
    color:var(--texto); text-transform:uppercase; transition:opacity .25s, border-color .2s; }
  .rotulo:hover, .rotulo:focus-visible { border-color:currentColor; outline:none; }
  .rotulo small { display:block; font-size:9.5px; letter-spacing:.08em; text-transform:none; color:var(--suave); text-align:center; }
  .rotulo[data-lab="gideon"] { color:var(--gideon); } .rotulo[data-lab="neural"] { color:var(--neural); } .rotulo[data-lab="world"] { color:var(--world); }
  .rotulo[data-lab="comando"] { color:var(--destaque); letter-spacing:.26em; }

  /* barra de baixo */
  nav#doca { position:fixed; left:50%; bottom:max(14px, env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:3; display:flex; gap:6px;
    padding:6px; border:1px solid var(--borda); border-radius:16px; background:rgba(4,10,18,.72); backdrop-filter:blur(8px); max-width:calc(100vw - 24px); overflow-x:auto; }
  nav#doca button, nav#doca a { flex:0 0 auto; background:transparent; border:1px solid transparent; border-radius:11px; padding:6px 10px; cursor:pointer;
    color:var(--texto); text-decoration:none; font-size:13px; white-space:nowrap; }
  nav#doca button:hover, nav#doca a:hover, nav#doca button:focus-visible, nav#doca a:focus-visible { border-color:var(--borda); background:rgba(16,49,74,.5); outline:none; }
  nav#doca button.ligado { border-color:var(--g-acento); background:rgba(31,91,255,.25); }
  nav#doca .sep { width:1px; background:var(--borda); margin:4px 2px; flex:0 0 1px; }
  nav#doca kbd { font:10px ui-monospace, monospace; color:var(--suave); margin-left:4px; }

  /* painel */
  #painel { position:fixed; top:0; right:0; bottom:0; width:min(460px, 100vw); z-index:4; background:var(--g-brilho-painel), var(--painel); border-left:1px solid var(--borda);
    backdrop-filter:blur(10px); transform:translateX(105%); transition:transform .32s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; }
  #painel.aberto { transform:none; }
  #painel header { position:static; pointer-events:auto; padding:18px 18px 12px; align-items:flex-end; }
  #painel h2 { margin:10px 0 0; }
  #fechar { background:rgba(10,12,30,.8); border:1px solid var(--g-borda-forte); border-radius:50%; width:36px; height:36px; cursor:pointer; color:var(--texto); font-size:15px; flex:0 0 36px; }
  #conteudo { padding:6px 18px 90px; overflow-y:auto; flex:1; }
  .bloco { padding:14px 16px; margin:0 0 14px; background:linear-gradient(180deg, var(--g-cartao-topo), var(--g-cartao)); border:1px solid var(--g-borda); border-radius:var(--g-raio);
    box-shadow:0 10px 30px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05); }
  .bloco h3 { margin:0 0 10px; font:700 11px/1.3 var(--g-fonte-titulo); letter-spacing:.16em; text-transform:uppercase; color:var(--g-texto); }
  .suave, .bloco p { color:var(--g-texto-2); }
  /* cartões de número grande (centro de comando) */
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 0 14px; }
  .stat { padding:14px 14px 12px; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .stat .g-rotulo { font-size:10px; color:var(--g-texto-2); }
  .stat .g-numero { font-size:clamp(28px, 5vw, 38px); }
  .stat .g-apoio { overflow-wrap:anywhere; }
  .stat.largo { grid-column:1 / -1; }
  .heroi { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:2px 0 14px; flex-wrap:wrap; }
  .passos { display:grid; gap:10px; margin:10px 0; }
  .passo { display:flex; gap:12px; align-items:center; padding:12px 14px; }
  .passo .g-passo { font-size:28px; flex:0 0 auto; }
  .passo .ag { font:700 10.5px var(--g-fonte-titulo); letter-spacing:.14em; text-transform:uppercase; color:var(--g-acento); }
  .suave { color:var(--suave); font-size:13px; }
  .linha { display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px solid rgba(28,58,82,.5); }
  .linha:first-of-type { border-top:0; }
  .linha .v { font-variant-numeric:tabular-nums; color:var(--destaque); text-align:right; }
  .barra { height:6px; border-radius:6px; background:rgba(110,170,255,.12); overflow:hidden; margin-top:6px; }
  .barra i { display:block; height:100%; border-radius:6px; background:linear-gradient(90deg, var(--g-ciano), var(--g-azul)); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; background:rgba(20,24,52,.7); color:var(--texto); border:1px solid var(--g-borda-forte);
    border-radius:12px; padding:10px 14px; cursor:pointer; text-decoration:none; font:600 14px/1 var(--g-fonte); }
  .btn:hover, .btn:focus-visible { background:rgba(40,46,100,.75); outline:none; }
  .btn.grande, .btn.ok { width:100%; background:var(--g-botao); border:0; color:#fff; font:700 13px/1 var(--g-fonte-titulo); letter-spacing:.14em; text-transform:uppercase;
    padding:14px; box-shadow:0 8px 24px rgba(70,80,255,.35); }
  .btn.grande:hover, .btn.ok:hover { filter:brightness(1.12); }
  .btn.ok { width:auto; flex:1; } .btn.perigo { border-color:rgba(255,123,123,.4); background:rgba(70,20,30,.6); }
  .btn[disabled] { opacity:.5; cursor:default; filter:none; }
  .acoes { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  textarea, input[type=text] { width:100%; background:rgba(6,8,22,.8); color:var(--texto); border:1px solid var(--borda); border-radius:10px; padding:9px 11px; font:inherit; resize:vertical; }
  textarea:focus, input:focus { outline:1px solid var(--link); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font:700 10px/1.4 var(--g-fonte-titulo); letter-spacing:.1em; text-transform:uppercase; padding:4px 9px; border-radius:6px; background:rgba(10,12,30,.7); border:1px solid var(--g-borda-forte); color:var(--g-texto-2); }
  .chip.parte { color:var(--aviso); border-color:rgba(255,207,110,.4); } .chip.pronto { color:var(--ok); border-color:rgba(61,220,151,.4); }
  .conversa { max-height:42vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
  .msg { padding:8px 11px; border-radius:12px; max-width:92%; white-space:pre-wrap; word-wrap:break-word; font-size:14px; }
  .msg.eu { align-self:flex-end; background:linear-gradient(135deg, rgba(31,91,255,.6), rgba(47,168,255,.5)); color:#fff; border-radius:14px 14px 4px 14px; }
  .msg.ela { align-self:flex-start; background:rgba(10,12,30,.7); border:1px solid var(--g-borda); color:var(--g-texto); border-radius:14px 14px 14px 4px; }
  .msg.ela a { word-break:break-all; }
  .erro { color:var(--erro); } .aviso { color:var(--aviso); }
  .carregando::after { content:"…"; animation:pontos 1.2s steps(3) infinite; display:inline-block; width:1em; overflow:hidden; vertical-align:bottom; }
  @keyframes pontos { from { width:0 } to { width:1em } }
  ol.plano { padding-left:20px; margin:8px 0; } ol.plano li { margin:3px 0; }
  .resultado { border-top:1px solid rgba(28,58,82,.5); padding:8px 0; font-size:14px; }
  .resultado small { color:var(--suave); font:700 10px var(--g-fonte-titulo); letter-spacing:.1em; text-transform:uppercase; }

  #aviso { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:5; max-width:min(420px, calc(100vw - 32px)); text-align:center;
    background:var(--painel); border:1px solid var(--borda); border-radius:16px; padding:18px; }
  #ajuda { position:fixed; left:16px; bottom:76px; z-index:2; font-size:11px; color:var(--suave); pointer-events:none; }

  @media (max-width: 380px) { .stats { grid-template-columns:1fr; } }
  @media (max-width: 640px) {
    #painel { top:auto; height:72vh; width:100vw; border-left:0; border-top:1px solid var(--borda); border-radius:18px 18px 0 0; transform:translateY(105%); }
    #painel.aberto { transform:none; }
    nav#doca kbd, #ajuda { display:none; }
    header h1 { font-size:13px; letter-spacing:.24em; }
    .rotulo { font-size:10px; letter-spacing:.14em; padding:2px 8px; } .rotulo small { display:none; }
  }
  @media (prefers-reduced-motion: reduce) { #painel { transition:none; } }
</style>

<script type="module">
import * as THREE from "./vendor/three-core.js";

// ---------- acesso (a mesma chave do GIDEON Home: link /home do Telegram, vale 30 dias) ----------
const FUNC = "https://ntgsrfqmlaocxjelvnef.supabase.co/functions/v1/";
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, filhos = []) => { const e = Object.assign(document.createElement(tag), props); e.append(...filhos.filter((f) => f != null)); return e; };
let chave = null;
const pedidoAbrir = (() => { const h = new URLSearchParams(location.hash.slice(1)); return h.get("abrir") ? { alvo: h.get("abrir"), mapa: h.get("mapa"), assunto: h.get("assunto") } : null; })();
try {
  const h = new URLSearchParams(location.hash.slice(1)).get("t");
  if (h) { localStorage.setItem("gideon_home", h); history.replaceState(null, "", location.pathname); }
  chave = localStorage.getItem("gideon_home");
} catch { chave = new URLSearchParams(location.hash.slice(1)).get("t"); }

async function api(funcao, rota, corpo) {
  const r = await fetch(FUNC + funcao + "/" + rota, { method: "POST", headers: { "Content-Type": "application/json", "x-gideon-home": chave || "" }, body: JSON.stringify(corpo ?? {}) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { semAcesso(); throw new Error("acesso negado"); }
  if (!r.ok) throw new Error(j.erro || ("erro " + r.status));
  return j;
}
const nexus = (rota, corpo) => api("nexus", rota, corpo);
const ferramenta = (nome, args) => api("gideon", "home-ferramenta", { nome, args }).then((j) => j.resultado ?? {});
function semAcesso() {
  const a = $("aviso"); if (!a.hidden) return; a.hidden = false;
  const campo = el("input", { type: "text", placeholder: "código de entrada", autocomplete: "one-time-code", autocapitalize: "characters", spellcheck: false, maxLength: 14 });
  campo.style.cssText = "text-align:center; letter-spacing:.2em; font:700 18px var(--g-fonte-titulo); text-transform:uppercase; margin-top:6px";
  const botao = el("button", { className: "btn grande", textContent: "Entrar" });
  const msg = el("p", { className: "suave" });
  const entrar = async () => {
    const codigo = campo.value.trim(); if (!codigo) { campo.focus(); return; }
    botao.disabled = true; msg.className = "suave carregando"; msg.textContent = "Conferindo";
    try {
      const r = await fetch(FUNC + "nexus/entrar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ codigo }) });
      const j = await r.json().catch(() => ({}));
      if (!j.ok || !j.chave) throw new Error(j.erro || "não deu certo");
      try { localStorage.setItem("gideon_home", j.chave); } catch { /* sem armazenamento */ }
      msg.className = "suave"; msg.textContent = "Liberado neste aparelho por 30 dias. Abrindo…";
      setTimeout(() => location.reload(), 600);
    } catch (e) { msg.className = "erro"; msg.textContent = "Não entrou: " + e.message + "."; botao.disabled = false; }
  };
  botao.addEventListener("click", entrar);
  campo.addEventListener("keydown", (e) => { if (e.key === "Enter") entrar(); });
  a.replaceChildren(
    el("p", { textContent: "🔒 Para abrir o GIDEON Core, mande /home no Telegram da GIDEON e abra o link pessoal uma vez neste aparelho." }),
    el("p", { className: "suave", textContent: "Sem Telegram? Peça um código de entrada ao Claude e digite aqui (vale 15 minutos, uma vez só):" }),
    campo, botao, msg);
  $("estadoTexto").textContent = "sem acesso";
}
const num = (n) => Number(n ?? 0).toLocaleString("pt-BR");
const hora = (iso) => iso ? new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "";
const tempoDesde = (s) => s == null ? "nunca" : s < 90 ? "agora" : s < 3600 ? `há ${Math.round(s / 60)} min` : s < 172800 ? `há ${Math.round(s / 3600)} h` : `há ${Math.round(s / 86400)} dias`;

// ---------- cena 3D: reator de energia no centro, base holográfica embaixo, labs em órbita (só azul e ciano) ----------
const LABS = [
  { id: "gideon", nome: "GIDEON LAB", sub: "conversa · missões · invenções", cor: 0x2fc6ff, angulo: Math.PI / 2 },
  { id: "neural", nome: "NEURAL LAB", sub: "modelos · memória · testes", cor: 0x3d7bff, angulo: Math.PI / 2 + (2 * Math.PI) / 3 },
  { id: "world", nome: "WORLD LAB", sub: "projetos · simulações", cor: 0x2fe0b0, angulo: Math.PI / 2 + (4 * Math.PI) / 3 },
];
const lento = matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas = $("cena");
let renderer = null;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" }); }
catch (e) { console.error(e); }
const cena = new THREE.Scene();
cena.fog = new THREE.FogExp2(0x010309, 0.03);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
const mundo = new THREE.Group(); cena.add(mundo);
let hover = null; // peça embaixo do mouse

const aditivo = (extra = {}) => ({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, ...extra });
const linhaMat = (cor, opacidade) => new THREE.LineBasicMaterial({ color: cor, ...aditivo({ opacity: opacidade }) });
const arestas = (geo, cor, opacidade) => new THREE.LineSegments(new THREE.EdgesGeometry(geo), linhaMat(cor, opacidade));
const brilho = (cor, forca = 1.4, fundo = 0.0) => new THREE.ShaderMaterial({ // brilho nas bordas (fresnel)
  uniforms: { cor: { value: new THREE.Color(cor) }, forca: { value: forca }, fundo: { value: fundo }, t: { value: 0 } },
  vertexShader: `varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform vec3 cor; uniform float forca; uniform float fundo; uniform float t; varying vec3 vN; varying vec3 vV;
    void main(){ float f = pow(1.0 - max(dot(vN, vV), 0.0), 2.4); float pulso = 0.88 + 0.12 * sin(t * 1.7); gl_FragColor = vec4(cor * (f * forca + fundo) * pulso, f * 0.85 + fundo); }`,
  ...aditivo(),
});
const VERT_UV = `varying vec2 vU; void main(){ vU = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;

// núcleo: plasma azul em movimento (ruído) dentro de uma casca de vidro
const plasma = new THREE.ShaderMaterial({
  uniforms: { t: { value: 0 } },
  vertexShader: `varying vec3 vP; varying vec3 vN; varying vec3 vV; void main(){ vP = position; vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform float t; varying vec3 vP; varying vec3 vN; varying vec3 vV;
    float h(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
    float n3(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(mix(h(i), h(i + vec3(1,0,0)), f.x), mix(h(i + vec3(0,1,0)), h(i + vec3(1,1,0)), f.x), f.y),
                 mix(mix(h(i + vec3(0,0,1)), h(i + vec3(1,0,1)), f.x), mix(h(i + vec3(0,1,1)), h(i + vec3(1,1,1)), f.x), f.y), f.z); }
    float fbm(vec3 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * n3(p); p *= 2.03; a *= 0.5; } return s; }
    void main(){
      vec3 p = vP * 2.4; float n = fbm(p + vec3(0.0, t * 0.35, t * 0.2)); n = fbm(p + n * 1.7 + vec3(t * 0.12));
      float f = pow(1.0 - max(dot(vN, vV), 0.0), 1.5);
      vec3 c = mix(vec3(0.0, 0.01, 0.09), vec3(0.01, 0.18, 0.75), smoothstep(0.3, 0.6, n));
      c = mix(c, vec3(0.25, 0.7, 1.0), smoothstep(0.62, 0.8, n));
      c += vec3(0.02, 0.25, 0.9) * f * 0.7;

  const p = $("painel"); p.classList.remove("aberto"); p.setAttribute("aria-hidden", "true");
  canvas.focus({ preventScroll: true });
}
$("fechar").addEventListener("click", fechar);
$("estadoSistema").addEventListener("click", () => abrir("comando"));
document.querySelectorAll("[data-abrir]").forEach((b) => b.addEventListener("click", () => abrir(b.dataset.abrir)));
const rodape = (texto) => el("p", { className: "g-rodape", textContent: `GIDEON · Core · ${texto}` });
const bloco = (titulo, ...filhos) => el("section", { className: "bloco" }, [titulo ? el("h3", { textContent: titulo }) : null, ...filhos]);
const linha = (nome, valor, extra) => el("div", { className: "linha" }, [el("span", {}, [nome, extra ? el("div", { className: "suave", textContent: extra }) : null]), el("span", { className: "v", textContent: valor })]);
const chipsModulos = (lista) => el("div", { className: "chips" }, lista.map(([n, nome, est]) => el("span", { className: "chip" + (est === "parte" ? " parte" : est === "pronto" ? " pronto" : ""), title: est === "parte" ? "existe em parte" : est === "pronto" ? "pronto" : "ainda não feito", textContent: `${n} ${nome}` })));

// dados compartilhados (centro de comando)
let dados = null, agentes = null;
async function carregarDados() {
  const [d, eq] = await Promise.all([nexus("comando"), agentes ? Promise.resolve(null) : api("gideon", "home-equipe", {}).catch(() => null)]);
  dados = d; if (eq?.agentes) agentes = eq.agentes;
  mostrarEstado(); return d;
}
function mostrarEstado() {
  const s = $("estadoSistema"), ok = dados?.sistema?.status === "operacional";
  s.className = ok ? "ok" : "atencao";
  $("estadoTexto").textContent = ok ? "sistema operacional" : "atenção";
  s.title = ok ? "Tudo funcionando. Abrir o centro de comando." : (dados?.sistema?.motivo || "Abrir o centro de comando");
}

async function painelComando(c) {
  const cartaoNum = (rotulo, numero, apoio, largo) => el("div", { className: "g-cartao stat" + (largo ? " largo" : "") }, [
    el("span", { className: "g-rotulo", textContent: rotulo }), el("span", { className: "g-numero", textContent: numero }), apoio ? el("span", { className: "g-apoio", textContent: apoio }) : null]);
  const desenhar = () => {
    const d = dados, nAg = agentes ? Object.keys(agentes).length + 2 : 6; // + diretor e revisor
    const tipos = Object.entries(d.documentos.por_tipo).sort((a, b) => b[1] - a[1]).map(([t, n]) => `${n} ${t}`).join(" · ");
    const ok = d.sistema.status === "operacional", uso = d.pc.uso;
    const pc = d.pc.ligado ? `${d.pc.computador ?? "PC"} · versão ${d.pc.versao ?? "?"}` : d.pc.versao ? `visto ${tempoDesde(d.pc.visto_ha_segundos)} · versão ${d.pc.versao}` : "não instalado";
    c.replaceChildren(...[
      el("div", { className: "heroi" }, [el("span", { className: "g-rotulo", textContent: "GIDEON AI · Command Center" }),
        el("span", { className: "g-status " + (ok ? "ok" : "atencao"), textContent: ok ? "Sistema operacional" : "Atenção", title: d.sistema.motivo || "" })]),
      ok ? null : el("p", { className: "aviso", textContent: d.sistema.motivo }),
      el("div", { className: "stats" }, [
        cartaoNum("🧠 Modelos ativos", num(d.modelos.length), d.modelos.map((m) => m.nome).join(", ") || "nenhum em 7 dias"),
        cartaoNum("🤖 Agentes", num(nAg), agentes ? ["Diretor", ...Object.values(agentes).map((a) => a.nome), "Revisor"].join(", ") : "equipe da GIDEON"),
        cartaoNum("⚙️ Automações", `${d.automacoes.ativas}/${d.automacoes.total}`, d.automacoes.falhas_24h ? `${d.automacoes.falhas_24h} falha(s) em 24 h` : "nenhuma falha em 24 h"),
        cartaoNum("💻 Projetos", num(d.projetos.nomes.length + d.projetos.github), `${d.projetos.nomes.join(", ") || "nenhum"} + ${d.projetos.github} no GitHub`),
        cartaoNum("📚 Documentos indexados", num(d.documentos.total), tipos, true),
        cartaoNum("📨 Pedidos hoje", num(d.hoje.pedidos), `${d.hoje.erros} erro(s) · ${d.hoje.cache} pelo cache`),
        cartaoNum("🧪 Nota dos testes", d.testes ? String(d.testes.nota).replace(".", ",") : "—", d.testes ? `${d.testes.passou} de ${d.testes.total} na última bateria` : "ainda sem bateria"),
      ]),
      bloco("Computador",
        linha("🖥️ GIDEON PC", d.pc.ligado ? "ligado" : "desligado", pc),
        linha("CPU · RAM · GPU", uso ? `${uso.cpu ?? "—"}% · ${uso.ram_gb ?? "—"} GB · ${uso.gpu ?? "—"}%` : "—", uso ? null : "aparece quando o GIDEON PC mandar o uso (próxima versão do programa)"),
        linha("✅ Aprovações esperando", num(d.aprovacoes_pendentes), d.aprovacoes_pendentes ? "aprove no Nexus ou no Telegram" : null),
        linha("👥 Missões andando", num(d.equipe_ativas)),
      ),
      el("button", { className: "btn grande", textContent: "Iniciar nova missão", onclick: () => abrir("missao") }),
      rodape(`números reais · atualizado às ${hora(d.agora)}`),
    ].filter(Boolean));
  };
  await carregarDados(); desenhar();
  atualizar = setInterval(() => { if (aberto === "comando") carregarDados().then(desenhar).catch(() => {}); }, 30_000);
}

// conversa com a GIDEON (a mesma do Nexus OS)
async function painelGideon(c) {
  const lista = el("div", { className: "conversa" }); lista.setAttribute("aria-live", "polite");
  const caixa = el("textarea", { rows: 2, placeholder: "Escreva para a GIDEON… (Enter envia)" });
  const enviar = el("button", { className: "btn", textContent: "Enviar" });
  const msg = (quem, texto) => { const m = el("div", { className: "msg " + quem }); m.append(...linkar(texto)); lista.append(m); lista.scrollTop = lista.scrollHeight; return m; };
  const mandar = async () => {
    const texto = caixa.value.trim(); if (!texto) return;
    caixa.value = ""; msg("eu", texto); const espera = msg("ela", ""); espera.classList.add("carregando"); enviar.disabled = true;
    try { const r = await nexus("conversa", { texto }); espera.classList.remove("carregando"); espera.replaceChildren(...linkar(r.resposta || "…")); if (r.abrir) seguirAbrir(r.abrir); }
    catch (e) { espera.classList.remove("carregando"); espera.replaceChildren(el("span", { className: "erro", textContent: "Não consegui falar com a GIDEON: " + e.message })); }
    enviar.disabled = false; lista.scrollTop = lista.scrollHeight;
  };
  enviar.addEventListener("click", mandar);
  caixa.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); mandar(); } });
  c.replaceChildren(
    bloco("Conversar com a GIDEON", lista, caixa, el("div", { className: "acoes" }, [enviar])),
    bloco("Ações",
      el("div", { className: "acoes" }, [
        el("button", { className: "btn", textContent: "🧭 Thought Map", onclick: () => abrirMapa() }),
        el("button", { className: "btn", textContent: "🚀 Nova missão da equipe", onclick: () => abrir("missao") }),
        el("a", { className: "btn", href: "./", textContent: "🎙️ Falar por voz" }),
        el("a", { className: "btn", href: "nexus.html", textContent: "🖥️ Nexus OS" }),
        el("a", { className: "btn", href: "equipe.html", textContent: "👥 Painel da equipe" }),
      ])),
    bloco("Módulos deste lab", chipsModulos([[61, "Interface 3D", "parte"], [100, "GIDEON Core", "parte"], [62, "Spatial Computing"], [63, "Reconstrutor 3D"], [64, "Invention Lab"], [65, "Bancada virtual"], [72, "Thought Map", "pronto"]])),
  );
  try {
    const h = await nexus("historico");
    for (const m of (h.mensagens ?? []).slice(-12)) msg(m.papel === "user" ? "eu" : "ela", m.texto);
    if (!h.mensagens?.length) lista.append(el("p", { className: "suave", textContent: "É a mesma conversa do Nexus OS. Diga oi." }));
  } catch { /* sem histórico */ }
  caixa.focus({ preventScroll: true });
}
function linkar(texto) { // texto com links clicáveis (só http/https), sem HTML
  const partes = []; let ult = 0;
  for (const m of String(texto).matchAll(/https?:\/\/[^\s)<>\]]+/g)) {
    partes.push(document.createTextNode(texto.slice(ult, m.index)));
    partes.push(el("a", { href: m[0], target: "_blank", rel: "noopener", textContent: m[0] }));
    ult = m.index + m[0].length;
  }
  partes.push(document.createTextNode(String(texto).slice(ult)));
  return partes;
}

async function painelNeural(c) {
  if (!dados) await carregarDados();
  const max = Math.max(1, ...dados.modelos.map((m) => m.usos_7d));
  const busca = el("input", { type: "text", placeholder: "Procurar na memória (ex.: projeto Total Match)" });
  const res = el("div");
  const procurar = async () => {
    const q = busca.value.trim(); if (!q) return;
    res.replaceChildren(el("p", { className: "suave carregando", textContent: "Procurando" }));
    try {
      const r = await ferramenta("buscar_memoria", { pergunta: q });
      const t = r.trechos ?? [];
      res.replaceChildren(...(t.length ? t.map((x) => el("div", { className: "resultado" }, [
        el("small", { textContent: `${x.tipo ?? ""}${x.projeto ? " · " + x.projeto : ""}${x.data ? " · " + String(x.data).slice(0, 10) : ""}` }),
        el("div", { textContent: String(x.conteudo ?? "").slice(0, 400) }),
        x.link ? el("a", { href: x.link, target: "_blank", rel: "noopener", textContent: "abrir" }) : null,
      ])) : [el("p", { className: "suave", textContent: r.erro || "Nada parecido na memória." })]));
    } catch (e) { res.replaceChildren(el("p", { className: "erro", textContent: e.message })); }
  };
  busca.addEventListener("keydown", (e) => { if (e.key === "Enter") procurar(); });
  c.replaceChildren(
    bloco("Modelos em uso (7 dias)", ...dados.modelos.map((m) => el("div", { className: "linha" }, [
      el("span", { style: "flex:1" }, [m.nome, el("div", { className: "barra" }, [el("i", { style: `width:${Math.round((m.usos_7d / max) * 100)}%` })])]),
      el("span", { className: "v", textContent: num(m.usos_7d) }),
    ])), el("p", { className: "suave", textContent: "Roteador: pedido simples vai para o modelo rápido, difícil para o forte, e pergunta repetida sai do cache sem gastar IA." })),
    bloco("Memória", linha("Documentos indexados", num(dados.documentos.total)), busca, el("div", { className: "acoes" }, [el("button", { className: "btn", textContent: "Procurar", onclick: procurar })]), res),
    bloco("Qualidade", linha("Nota dos testes semanais", dados.testes ? `${String(dados.testes.nota).replace(".", ",")}/10` : "—", "a GIDEON se testa todo domingo e propõe melhorias")),
    bloco("Módulos deste lab", chipsModulos([[71, "Cognitive Router", "parte"], [89, "Benchmark", "parte"], [88, "Dados sintéticos", "parte"], [75, "Knowledge Forge", "parte"], [86, "Neural Visualizer"], [87, "Model Surgeon"], [90, "Neural Compiler"]])),
  );
}

// nova missão: o diretor monta o plano; só começa depois do seu OK aqui
async function painelMissao(c) {
  const caixa = el("textarea", { rows: 4, placeholder: "O que a equipe deve fazer? Ex.: compare 3 notebooks até 4 mil reais para programar e me recomende um." });
  const planejar = el("button", { className: "btn", textContent: "Montar o plano" });
  const area = el("div");
  planejar.addEventListener("click", async () => {
    const objetivo = caixa.value.trim(); if (!objetivo) { caixa.focus(); return; }
    planejar.disabled = true; area.replaceChildren(el("p", { className: "suave carregando", textContent: "O diretor está montando o plano (uns 20 s)" }));
    try {
      const r = await ferramenta("equipe_iniciar", { objetivo, confirmado: false });
      if (r.erro || !r.missao_id) throw new Error(r.erro || "o diretor não devolveu um plano");
      const p = r.resumo ?? {};
      const aprovar = el("button", { className: "btn ok", textContent: "✅ Aprovar e começar" });
      const cancelar = el("button", { className: "btn perigo", textContent: "Cancelar" });
      area.replaceChildren(bloco(p.titulo || "Plano",
        p.resumo ? el("p", { textContent: p.resumo }) : null,
        el("div", { className: "passos" }, (p.tarefas ?? []).map((t, i) => el("div", { className: "g-cartao passo" }, [
          el("span", { className: "g-passo", textContent: String(i + 1).padStart(2, "0") }),
          el("div", {}, [el("div", { className: "ag", textContent: t.agente }), el("div", { textContent: t.titulo })])]))),
        p.entregavel ? el("p", { className: "suave", textContent: "Você recebe: " + p.entregavel }) : null,
        el("div", { className: "acoes" }, [aprovar, cancelar])));
      aprovar.addEventListener("click", async () => {
        aprovar.disabled = cancelar.disabled = true;
        try {
          const ok = await ferramenta("equipe_iniciar", { missao_id: r.missao_id, confirmado: true });
          if (ok.erro) throw new Error(ok.erro);
          area.replaceChildren(bloco("Missão começou", el("p", { textContent: ok.aviso || "A equipe começou. O andamento aparece no Telegram." }),
            el("div", { className: "acoes" }, [el("a", { className: "btn", href: "equipe.html", textContent: "👥 Acompanhar no painel da equipe" })])));
        } catch (e) { area.append(el("p", { className: "erro", textContent: "Não consegui começar: " + e.message })); aprovar.disabled = cancelar.disabled = false; }
      });
      cancelar.addEventListener("click", async () => {
        aprovar.disabled = cancelar.disabled = true;
        await ferramenta("equipe_cancelar", { missao_id: r.missao_id }).catch(() => {});
        area.replaceChildren(el("p", { className: "suave", textContent: "Plano cancelado. Nada foi feito." }));
      });
    } catch (e) { area.replaceChildren(el("p", { className: "erro", textContent: "Não consegui montar o plano: " + e.message })); }
    planejar.disabled = false;
  });
  c.replaceChildren(bloco("Objetivo", caixa, el("div", { className: "acoes" }, [planejar]),
    el("p", { className: "suave", textContent: "A equipe (diretor, pesquisador, analista, programador, testador e revisor) só começa depois que você aprovar o plano. O resultado chega no Telegram." })), area);
  caixa.focus({ preventScroll: true });
}

// "GIDEON, abre ..." — o endereço diz o que abrir (o link vem da ferramenta abrir_na_tela)
function obedecer(p) {
  if (!p || !chave) return;
  if (p.alvo === "mapa") abrirMapa({ id: p.mapa || null, assunto: p.assunto || null });
  else if (["comando", "gideon", "neural", "world", "missao"].includes(p.alvo)) abrir(p.alvo);
}
setTimeout(() => obedecer(pedidoAbrir), 400);
addEventListener("hashchange", () => { const h = new URLSearchParams(location.hash.slice(1)); if (h.get("abrir")) obedecer({ alvo: h.get("abrir"), mapa: h.get("mapa"), assunto: h.get("assunto") }); });
// a conversa (GIDEON Lab) pediu para abrir uma tela: se é aqui mesmo, abre sem recarregar; senão, vai para a página
function seguirAbrir(url) {
  try {
    const u = new URL(url, location.href);
    if (u.pathname.endsWith("/core.html")) { const h = new URLSearchParams(u.hash.slice(1)); setTimeout(() => obedecer({ alvo: h.get("abrir") || "comando", mapa: h.get("mapa"), assunto: h.get("assunto") }), 900); }
    else setTimeout(() => { location.href = u.href; }, 1200);
  } catch { /* endereço estranho: ignora */ }
}

// estado do sistema no topo (sem abrir painel)
if (chave) carregarDados().catch(() => { $("estadoTexto").textContent = "sem conexão"; });
else semAcesso();
setInterval(() => { if (chave && aberto !== "comando" && !document.hidden) carregarDados().catch(() => {}); }, 60_000);
</script>
