<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<title>GIDEON</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
<style>
  :root { --fundo:#04060c; --texto:#d8f3ff; --suave:#6f8ba3; --ciano:#27c4ff; --ambar:#ffb547; --violeta:#9b7bff; --vermelho:#ff6b6b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--fundo); color:var(--texto); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  main { height:100%; display:grid; grid-template-rows:auto 1fr auto auto; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  header { display:flex; justify-content:space-between; align-items:center; }
  h1 { font-size:11px; letter-spacing:.35em; font-weight:400; color:#4f86b8; font-family:Michroma, system-ui, sans-serif; }
  #marca { text-align:center; padding:4px 0 10px; }
  #marca b { display:block; font: 400 clamp(22px, 6vw, 40px)/1 Michroma, "Segoe UI", system-ui, sans-serif; letter-spacing:.62em; margin-right:-.62em; color:#eaf6ff;
    text-shadow: 0 0 6px rgba(120,200,255,.9), 0 0 22px rgba(40,140,255,.55); }
  #marca i { display:block; height:2px; margin:14px auto 0; width:min(78vw, 560px); background: radial-gradient(closest-side, #bfe6ff, #2a8cff 38%, rgba(20,90,255,.25) 70%, transparent); box-shadow:0 0 18px 2px rgba(40,140,255,.6); }
  #rosto { position:fixed; inset:0; width:100vw; height:100vh; display:block; z-index:0; }
  main { position:relative; z-index:1; }
  #aviso, #diag, #mics { z-index:10; }
  .com-rosto #orbe { display:none; }
  #palco { cursor:pointer; -webkit-tap-highlight-color:transparent; }
  #dica, #barra { z-index:1; }
  #estado { font-size:12px; letter-spacing:.15em; text-transform:uppercase; color:var(--suave); }
  #palco { position:relative; display:grid; place-items:center; min-height:0; }
  canvas { width:min(78vw, 60vh); height:min(78vw, 60vh); cursor:pointer; -webkit-tap-highlight-color:transparent; }
  #dica { position:absolute; bottom:6%; font-size:13px; color:var(--suave); text-align:center; }
  #barra { position:absolute; bottom:2%; width:140px; height:4px; border-radius:4px; background:#14202d; overflow:hidden; }
  #nivel { display:block; height:100%; width:0; background:var(--ciano); transition:width .08s; }
  #legendas { min-height:118px; max-width:720px; width:100%; margin:0 auto; display:grid; gap:8px; align-content:end; }
  .fala { font-size:15px; line-height:1.4; opacity:.95; }
  .fala.dono { color:var(--suave); }
  .fala.dono::before { content:"Você: "; color:var(--suave); }
  .fala.gideon::before { content:"GIDEON: "; color:var(--ciano); font-weight:600; }
  #aviso { position:fixed; inset:0; display:none; place-items:center; background:rgba(4,6,12,.94); padding:24px; text-align:center; }
  #aviso.on { display:grid; }
  #aviso p { max-width:420px; line-height:1.5; }
  #aviso code { color:var(--ciano); }
  #diag { position:fixed; left:12px; bottom:8px; font: 11px/1.4 ui-monospace, monospace; color:#4d6a82; white-space:pre; pointer-events:none; }
  #mics { position:fixed; right:12px; bottom:8px; max-width:min(60vw, 320px); background:#0a121c; color:var(--suave); border:1px solid #1c2a3a; border-radius:8px; padding:4px 6px; font-size:12px; }
  button.sair { background:none; border:1px solid #1c2a3a; color:var(--suave); border-radius:999px; padding:6px 12px; font-size:12px; }
  /* cartões: o que ela consultou ou fez por voz aparece também na tela */
  #topo-dir { display:flex; align-items:center; gap:10px; }
  #btnMaos[aria-pressed="true"] { background:#0d3a52; border-color:#27c4ff; color:#fff; }
  #btnEquipe { text-decoration:none; }
  #btnHist, #btnMaos, #btnEquipe { background:rgba(10,18,28,.7); border:1px solid #1c3a52; color:#8fd8ff; border-radius:999px; padding:5px 11px; font-size:12px; cursor:pointer; }
  #cartoes { position:fixed; z-index:5; right:16px; top:56px; width:min(340px, 32vw); max-height:calc(100vh - 220px); overflow-y:auto; display:flex; flex-direction:column; gap:10px; scrollbar-width:thin; }
  .cartao { background:rgba(6,14,24,.82); border:1px solid rgba(60,170,255,.35); border-radius:12px; padding:10px 12px; box-shadow:0 0 18px rgba(30,140,255,.15); backdrop-filter:blur(4px); animation:entra .35s ease; }
  .cartao.some { opacity:0; transform:translateX(12px); transition:all .4s; }
  @keyframes entra { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:none; } }
  .cartao h3 { font-size:13px; font-weight:600; color:#bfe6ff; display:flex; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .cartao h3 button { background:none; border:none; color:var(--suave); cursor:pointer; font-size:13px; }
  .cartao ul { list-style:none; display:grid; gap:6px; }
  .cartao li { font-size:13px; line-height:1.35; color:var(--texto); }
  .cartao li small { display:block; color:var(--suave); font-size:11.5px; }
  .cartao a { color:var(--ciano); text-decoration:none; }
  .cartao .vazio { color:var(--suave); font-size:12.5px; }
  .cartao .acoes { display:flex; gap:8px; margin-top:10px; }
  .cartao .acoes button { flex:1; border-radius:8px; padding:8px; font-size:13px; cursor:pointer; border:1px solid; }
  .cartao .sim { background:rgba(39,196,255,.15); border-color:var(--ciano); color:#dff6ff; }
  .cartao .nao { background:transparent; border-color:#3a4a5a; color:var(--suave); }
  .cartao .situacao { margin-top:8px; font-size:12.5px; color:var(--suave); }
  .cartao.pedido { border-color:rgba(255,181,71,.55); box-shadow:0 0 18px rgba(255,181,71,.18); }
  @media (max-width: 760px) {
    #cartoes { left:12px; right:12px; top:auto; bottom:150px; width:auto; max-height:none; flex-direction:row; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; }
    .cartao { flex:0 0 82%; max-height:34vh; overflow-y:auto; scroll-snap-align:start; }
  }
  /* histórico das conversas */
  #historico { position:fixed; z-index:20; top:0; right:0; bottom:0; width:min(440px, 100vw); background:rgba(4,8,14,.97); border-left:1px solid #13283a; transform:translateX(105%); transition:transform .3s; display:flex; flex-direction:column; }
  #historico.on { transform:none; }
  #historico header { padding:16px; border-bottom:1px solid #13283a; }
  #historico header button { background:none; border:none; color:var(--suave); font-size:18px; cursor:pointer; }
  #listaHist { overflow-y:auto; padding:12px 16px 24px; display:grid; gap:10px; align-content:start; }
  .msg { font-size:14px; line-height:1.4; padding:8px 10px; border-radius:10px; background:#0a1520; white-space:pre-wrap; word-wrap:break-word; }
  .msg.user { background:#0d1a26; color:#b9cfe0; }
  .msg.model { border:1px solid #143247; }
  .msg small { display:block; font-size:11px; color:#56738c; margin-bottom:3px; }
</style>
</head>
<body>
<main>
  <header><h1>GIDEON</h1><div id="topo-dir"><button id="btnMaos" aria-pressed="false" title="Ligado: diga &quot;GIDEON&quot; para chamar, sem tocar na tela. O reconhecimento de voz do navegador ouve até você chamar.">🎙️ Mãos livres</button><button id="btnHist" aria-label="Ver histórico das conversas">🕘 Histórico</button><a id="btnEquipe" href="equipe.html" title="O que a equipe de agentes está fazendo">👥 Equipe</a><div id="estado">desligado</div></div></header>
  <div id="diag" hidden></div>
  <select id="mics" hidden aria-label="Microfone"></select>
  <section id="palco" role="button" aria-label="Toque para falar com o GIDEON"><canvas id="orbe" width="800" height="800" aria-hidden="true"></canvas><div id="dica">Toque para conversar</div><div id="barra"><i id="nivel"></i></div></section>
  <div id="marca" aria-hidden="true"><b>GIDEON</b><i></i></div>
  <section id="legendas"><div class="fala dono" id="ultDono" hidden></div><div class="fala gideon" id="ultGideon" hidden></div></section>
</main>
<aside id="cartoes" aria-live="polite"></aside>
<aside id="historico" aria-label="Histórico das conversas"><header><h1>HISTÓRICO</h1><button id="fecharHist" aria-label="Fechar">✕</button></header><div id="listaHist"></div></aside>
<div id="aviso"><p>Para abrir o GIDEON Home, mande <code>/home</code> para o GIDEON no Telegram e toque no link que ele enviar.<br><br>O link é pessoal e vale 30 dias.</p></div>
<script>
const FUNC = "https://ntgsrfqmlaocxjelvnef.supabase.co/functions/v1/gideon/";
const $ = (id) => document.getElementById(id);
const diag = { audio: "-", enviado: 0, recebido: 0, ultimo: "-", nivelMax: 0, eventos: [], erro: null, fechou: null, falaReconhecida: false, respostas: 0 };
let diagEnviado = false;
function enviarDiag(motivo, ok = false) { // manda ao GIDEON o que aconteceu, para o Claude poder ajudar sem prints
  if (diagEnviado || !chave) return; diagEnviado = true;
  const corpo = { motivo, ok, ...diag, eventos: diag.eventos.slice(-15), navegador: navigator.userAgent, idioma: navigator.language, hora: new Date().toISOString() };
  fetch(FUNC + "home-diagnostico", { method: "POST", headers: { "Content-Type": "application/json", "x-gideon-home": chave }, body: JSON.stringify(corpo), keepalive: true }).catch(() => {});
}
function evento(e) { diag.eventos.push(`${((Date.now() - (diag.t0 || Date.now())) / 1000).toFixed(1)}s ${e}`); }
const mostrarDiag = location.hash.includes("debug") || localStorage.getItem("gideon_debug") === "1";
if (mostrarDiag) { $("diag").hidden = false; setInterval(() => { $("diag").textContent = `áudio: ${diag.audio}\nenviado: ${(diag.enviado / 1024).toFixed(0)} kB · recebido: ${(diag.recebido / 1024).toFixed(0)} kB\núltimo evento: ${diag.ultimo}`; }, 300); }

// ---------- chave de acesso (vem no link do Telegram: #t=...) ----------
let chave = null;
try {
  const h = new URLSearchParams(location.hash.slice(1)).get("t");
  if (h) { localStorage.setItem("gideon_home", h); history.replaceState(null, "", location.pathname); }
  chave = localStorage.getItem("gideon_home");
} catch { chave = new URLSearchParams(location.hash.slice(1)).get("t"); }
if (!chave || Number(chave.split(".")[0]) < Date.now()) $("aviso").classList.add("on");
async function api(rota, corpo) {
  const r = await fetch(FUNC + rota, { method: "POST", headers: { "Content-Type": "application/json", "x-gideon-home": chave }, body: JSON.stringify(corpo ?? {}) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { $("aviso").classList.add("on"); throw new Error("acesso negado"); }
  if (!r.ok) throw new Error(j.erro || ("erro " + r.status));
  return j;
}

// ---------- estado e orbe ----------
let estado = "desligado", nivelMic = 0, nivelVoz = 0, suave = 0;
const CORES = { desligado:[111,139,163], conectando:[155,123,255], ouvindo:[39,196,255], pensando:[255,181,71], falando:[155,123,255], erro:[255,107,107] };
window.gideonSinais = () => ({ estado, mic: nivelMic, voz: nivelVoz, analisador }); // o rosto 3D lê daqui
function mudar(e, dica) { estado = e; $("estado").textContent = e; if (dica !== undefined) $("dica").textContent = dica; }
const cv = $("orbe"), g = cv.getContext("2d");
window.gideonOrbe = () => requestAnimationFrame(desenhar); // o rosto 3D chama se falhar
function desenhar(t) {
  if (document.body.classList.contains("com-rosto")) return; // o rosto 3D assumiu
  const alvo = estado === "falando" ? nivelVoz : estado === "ouvindo" ? nivelMic : estado === "pensando" ? 0.15 + 0.1 * Math.sin(t / 180) : 0.04;
  suave += (Math.min(alvo * 3, 1) - suave) * 0.18;
  const [r, gg, b] = CORES[estado] || CORES.desligado, c = 400, base = 210;
  g.clearRect(0, 0, 800, 800);
  for (let i = 5; i >= 1; i--) { // halo
    g.beginPath(); g.arc(c, c, base + i * 22 + suave * 70 + 4 * Math.sin(t / 600 + i), 0, Math.PI * 2);
    g.fillStyle = `rgba(${r},${gg},${b},${0.035 * (6 - i)})`; g.fill();
  }
  const raio = base + suave * 55;
  const grad = g.createRadialGradient(c - 40, c - 50, 10, c, c, raio);
  grad.addColorStop(0, "rgba(235,250,255,.95)"); grad.addColorStop(0.35, `rgba(${r},${gg},${b},.9)`); grad.addColorStop(1, "rgba(4,6,12,.2)");
  g.beginPath(); g.arc(c, c, raio, 0, Math.PI * 2); g.fillStyle = grad; g.fill();
  g.lineWidth = 3; g.strokeStyle = `rgba(${r},${gg},${b},.55)`;
  g.beginPath(); for (let a = 0; a <= Math.PI * 2 + 0.01; a += Math.PI / 90) { // anel que ondula com a voz
    const rr = raio + 28 + suave * 40 * Math.sin(a * 6 + t / 200); g.lineTo(c + rr * Math.cos(a), c + rr * Math.sin(a)); } g.stroke();
  requestAnimationFrame(desenhar);
}
requestAnimationFrame(desenhar);

// ---------- áudio ----------
let ws = null, ctxMic = null, ctxVoz = null, analisador = null, fluxo = null, noMic = null, proximo = 0, fontes = [], travaTela = null;
const CAPTURA = `class Captura extends AudioWorkletProcessor {
  constructor(){ super(); this.buf=[]; this.passo=sampleRate/16000; this.acc=0; }
  process(entradas){ const ch=entradas[0][0]; if(!ch) return true;
    for(let i=0;i<ch.length;i++){ this.acc+=1; if(this.acc>=this.passo){ this.acc-=this.passo; this.buf.push(ch[i]); } }
    if(this.buf.length>=1600){ const pcm=new Int16Array(this.buf.length); let s2=0;
      for(let i=0;i<this.buf.length;i++){ const s=Math.max(-1,Math.min(1,this.buf[i])); pcm[i]=s<0?s*0x8000:s*0x7fff; s2+=s*s; }
      this.port.postMessage({pcm:pcm.buffer,nivel:Math.sqrt(s2/this.buf.length)},[pcm.buffer]); this.buf=[]; }
    return true; } }
registerProcessor('captura', Captura);`;
const paraBase64 = (buf) => { const b = new Uint8Array(buf); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
function tocar(b64) {
  const bin = atob(b64), n = bin.length / 2, f = new Float32Array(n);
  for (let i = 0; i < n; i++) { let v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8); if (v >= 32768) v -= 65536; f[i] = v / 32768; }
  const buf = ctxVoz.createBuffer(1, n, 24000); buf.copyToChannel(f, 0);
  const src = ctxVoz.createBufferSource(); src.buffer = buf; src.connect(analisador);
  proximo = Math.max(proximo, ctxVoz.currentTime + 0.03); src.start(proximo); proximo += buf.duration;
  fontes.push(src); src.onended = () => { fontes = fontes.filter((x) => x !== src); if (!fontes.length && estado === "falando") mudar("ouvindo", "Pode falar"); };
  mudar("falando", "Toque para encerrar · pode interromper falando");
}
function calar() { fontes.forEach((s) => { try { s.stop(); } catch {} }); fontes = []; proximo = 0; }
function medirVoz() { if (!analisador) return; const d = new Uint8Array(analisador.fftSize); analisador.getByteTimeDomainData(d); let s = 0; for (const v of d) s += ((v - 128) / 128) ** 2; nivelVoz = Math.sqrt(s / d.length); requestAnimationFrame(medirVoz); }

// ---------- cartões na tela: o que ela consultou ou fez por voz ----------
const el = (tag, props = {}, ...filhos) => { const e = Object.assign(document.createElement(tag), props); for (const f of filhos) if (f != null) e.append(f); return e; };
const linkSeguro = (u) => (typeof u === "string" && /^https:\/\//.test(u) ? u : null);
const dataBR = (iso) => { try { return iso ? new Date(iso).toLocaleDateString("pt-BR") : ""; } catch { return ""; } };
const CARTOES = { // ferramenta → { titulo, itens: [{ texto, sub, link }] } (null = não mostra)
  listar_lembretes: (r) => ({ titulo: "⏰ Lembretes", itens: (r.lembretes || []).map((l) => ({ texto: l.texto, sub: [l.quando, l.recorrencia].filter(Boolean).join(" · ") })) }),
  criar_lembrete: (r, a) => (r.erro ? null : { titulo: "⏰ Lembrete criado", itens: [{ texto: a.texto, sub: r.quando_brasilia }] }),
  cancelar_lembrete: (r) => (r.cancelado ? { titulo: "⏰ Lembrete cancelado", itens: [{ texto: r.cancelado.texto }] } : null),
  listar_tarefas: (r) => ({ titulo: "✔️ Tarefas abertas", itens: (r.tarefas || []).map((t) => ({ texto: t.titulo, sub: [t.prazo && "prazo " + t.prazo, t.projeto].filter(Boolean).join(" · ") })) }),
  criar_tarefa: (r) => (r.erro ? null : { titulo: "✔️ Tarefa criada", itens: [{ texto: r.titulo }] }),
  concluir_tarefa: (r) => (r.concluida ? { titulo: "✔️ Tarefa concluída", itens: [{ texto: r.concluida.titulo }] } : null),
  agenda_listar: (r) => ({ titulo: "📅 Agenda", itens: (r.eventos || []).map((e) => ({ texto: e.titulo, sub: [e.inicio, e.local].filter(Boolean).join(" · "), link: e.link })) }),
  agenda_criar: (r) => (r.criado ? { titulo: "📅 Evento criado", itens: [{ texto: r.criado.titulo, sub: r.criado.inicio, link: r.link }] } : null),
  gmail_buscar: (r) => ({ titulo: "✉️ E-mails", itens: (r.emails || []).map((e) => ({ texto: e.assunto || "(sem assunto)", sub: e.de })) }),
  gmail_ler: (r) => (r.erro ? null : { titulo: "✉️ " + (r.assunto || "E-mail"), itens: [{ texto: String(r.texto || "").slice(0, 280) + (String(r.texto || "").length > 280 ? "…" : ""), sub: r.de }] }),
  drive_buscar: (r) => ({ titulo: "📁 Drive", itens: (r.arquivos || []).map((f) => ({ texto: f.nome, sub: f.modificado, link: f.link })) }),
  buscar_memoria: (r) => ({ titulo: "🧠 Da memória", itens: (r.trechos || []).map((t) => ({ texto: String(t.conteudo || "").slice(0, 160), sub: [t.tipo, dataBR(t.data), t.projeto].filter(Boolean).join(" · "), link: t.link })) }),
  guardar_nota: (r) => (r.guardado ? { titulo: "📝 Anotado na memória", itens: [] } : null),
  listar_projetos: (r) => ({ titulo: "🗂️ Projetos", itens: (r.projetos || []).map((p) => ({ texto: p.nome, sub: `${p.itens} itens · última atividade ${p.ultima_atividade || "—"}` })) }),
  criar_projeto: (r) => (r.erro ? null : { titulo: "🗂️ Projeto " + (r.criado ? "criado" : "atualizado"), itens: [{ texto: r.criado || r.atualizado, sub: `${r.itens_antigos_marcados ?? 0} itens antigos marcados` }] }),
  pesquisar_web: (r) => (r.erro ? null : { titulo: "🔎 Pesquisa na internet", itens: [{ texto: String(r.resposta || "").slice(0, 280) + (String(r.resposta || "").length > 280 ? "…" : "") }, ...(r.fontes || []).map((f) => ({ texto: f.titulo, link: f.link }))] }),
  ler_pagina: (r) => (r.erro ? null : { titulo: "🌐 " + (r.titulo || "Página"), itens: [{ texto: String(r.texto || "").slice(0, 280) + "…", link: r.link }] }),
  pesquisa_profunda: (r) => (r.iniciada ? { titulo: "🔎 Pesquisa profunda iniciada", itens: [{ texto: "O resumo e o relatório com as fontes chegam no Telegram em 1 a 3 minutos." }] } : null),
  linha_do_tempo: (r, a) => (r.erro ? null : { titulo: "🗂️ " + (a.projeto || "Projeto"), itens: (r.itens || []).map((i) => ({ texto: String(i.resumo || "").slice(0, 140), sub: [i.data, i.tipo].filter(Boolean).join(" · "), link: i.link })) }),
  // GIDEON PC (computador do dono)
  pc_status: (r) => ({ titulo: "💻 GIDEON PC", itens: [{ texto: r.ligado ? "Ligado" : "Desligado", sub: r.pasta || r.aviso || "" }] }),
  pc_listar: (r) => ({ titulo: "💻 " + (r.pasta || "Pasta liberada"), itens: (r.itens || []).map((i) => ({ texto: (i.tipo === "pasta" ? "📁 " : "") + i.nome, sub: [i.tamanho, i.modificado].filter(Boolean).join(" · ") })) }),
  pc_procurar: (r) => ({ titulo: "💻 Arquivos achados", itens: (r.achados || []).map((i) => ({ texto: i.nome, sub: i.caminho })) }),
  pc_ler_arquivo: (r) => (r.erro ? null : { titulo: "💻 " + (r.caminho || "Arquivo"), itens: [{ texto: String(r.texto || "").slice(0, 280) + (String(r.texto || "").length > 280 ? "…" : "") }] }),
  pc_ver_tela: (r) => (r.erro ? null : { titulo: "🖥️ Sua tela", itens: [{ texto: String(r.descricao || "").slice(0, 600) + (String(r.descricao || "").length > 600 ? "…" : ""), sub: "print não guardado" }] }),

      if (!m) continue;

      pararChamado(); porChamado = true; ultimaAtividade = Date.now(); comecar(); return;
    }
  };
  r.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") { maosLivres = false; salvarMaos(); botaoMaos(); mudar("desligado", "O navegador bloqueou o microfone para o mãos livres: permita no cadeado ao lado do endereço"); }
    else if (e.error === "network") falhasRec++;
  };
  r.onend = () => { if (rec !== r) return; recAtivo = false; rec = null; if (maosLivres && estado === "esperando") setTimeout(ouvirChamado, Math.min(10000, 300 + falhasRec * 2000)); }; // o navegador para sozinho de tempos em tempos: recomeça
  try { r.start(); recAtivo = true; mudar("esperando", 'Diga "GIDEON" para chamar · ou toque'); } catch { recAtivo = false; rec = null; }
}
setInterval(() => { // conversa aberta pelo nome e ninguém falou por 15 s: fecha e volta a esperar o "GIDEON"
  if (maosLivres && porChamado && ws && estado === "ouvindo" && !fontes.length && Date.now() - ultimaAtividade > 15000) desligar('Diga "GIDEON" para chamar');
}, 2000);
$("btnMaos").addEventListener("click", (e) => {
  e.stopPropagation();
  if (!Reconhecedor) { mudar(estado, "Este navegador não reconhece voz: use o Chrome ou o Edge"); return; }
  maosLivres = !maosLivres; salvarMaos(); botaoMaos();
  if (maosLivres) ouvirChamado();
  else { pararChamado(); if (estado === "esperando") mudar("desligado", "Toque para conversar"); }
});
try { // estava ligado da última vez: liga de novo no primeiro toque (o navegador só libera o som depois de um toque)
  if (Reconhecedor && localStorage.getItem("gideon_maos") === "1") {
    $("dica").textContent = "Toque em qualquer lugar para voltar ao mãos livres";
    document.addEventListener("pointerdown", function primeiroToque(ev) {
      document.removeEventListener("pointerdown", primeiroToque);
      if (ev.target.closest("#btnMaos, #palco")) return; // o próprio botão ou o palco decidem
      maosLivres = true; botaoMaos(); ouvirChamado();
    });
  }
} catch {}
</script>
<script type="module">
import { iniciarRosto } from "./rosto.js";
try { iniciarRosto(document.getElementById("palco")); document.body.classList.add("com-rosto"); }
catch (e) { console.warn("Rosto 3D indisponível; fica o orbe.", e); }
</script>
