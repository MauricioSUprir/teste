name: backup-dados

# Rede de segurança dos dados do site.
#
# O servidor roda no Render em plano free: o disco é temporário e some a cada
# publicação. Este robô roda de hora em hora, baixa cadastros B2B, pedidos,
# avaliações, afiliados, preços manuais e banners, e versiona tudo aqui no
# repositório. É daqui que o servidor se recupera quando sobe de novo.
on:
  schedule:
    # de 10 em 10 minutos: uma publicação do servidor apaga o /tmp, então
    # quanto menor esta janela, menos coisa se perde no caminho
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths:
      # para rodar na hora: basta mudar este arquivo
      - ".github/pedido-backup.txt"
      # mexer no servidor dispara uma publicação no Render, que apaga o /tmp.
      # O robô corre junto e salva o estado antes da troca de instância.
      - "apps/servidor/**"

permissions:
  contents: write

# duas execuções ao mesmo tempo brigariam pelo push
concurrency:
  group: backup-dados
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # os arquivos de backup moram na branch de trabalho, que é de onde o
          # servidor os lê (ver os *_BACKUP_URL em apps/servidor/index.mjs)
          ref: claude/beauty-now-ecommerce-fbfxh2

      - name: Baixar os dados vivos do servidor
        env:
          SERVIDOR: https://beautynow-servidor.onrender.com
        run: |
          CHAVE="$(head -n1 .github/pedido-logos.txt | tr -d '[:space:]')" \
            node scripts/backup-dados.mjs

      - name: Guardar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add b2b-backup.json afiliados-backup.json avaliacoes-backup.json \
                  pedidos-backup.json precos-backup.json banners-enviados.json || true
          if git diff --cached --quiet; then
            echo "sem mudanças — nada a guardar"
            exit 0
          fi
          git commit -m "chore(backup): dados do servidor de $(date -u '+%d/%m %H:%M') UTC"
          git pull --rebase origin claude/beauty-now-ecommerce-fbfxh2 || true
          git push origin HEAD:claude/beauty-now-ecommerce-fbfxh2
