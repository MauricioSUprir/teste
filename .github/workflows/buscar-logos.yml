name: buscar-logos

# Ponte de logos: o runner do GitHub tem internet aberta, então ele chama o
# exportador de logos do servidor (Render) e grava o resultado no repositório.
# Gatilho: qualquer push que altere .github/pedido-logos.txt (a chave vai nele).
on:
  push:
    paths:
      - ".github/pedido-logos.txt"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar logos pelo exportador do servidor
        run: |
          chave="$(head -n1 .github/pedido-logos.txt | tr -d '[:space:]')"
          ok=""
          for i in 1 2 3 4; do
            if curl -fsS --max-time 280 \
              "https://beautynow-servidor.onrender.com/exportar-logos?chave=${chave}" \
              -o logos-marcas-v2.json; then
              ok=1; break
            fi
            echo "tentativa $i falhou (servidor acordando?); aguardando 40s"
            sleep 40
          done
          test -n "$ok" && test -s logos-marcas-v2.json
          node -e "const j=require('./logos-marcas-v2.json'); console.log('logos ok:', j.total, '| falhas:', JSON.stringify(j.falhas))"

      - name: Caçada extra nas marcas que faltam (direto do runner)
        run: node scripts/buscar-logos-extra.mjs
        continue-on-error: true

      - name: Caçada com navegador de verdade (sites com anti-robô)
        run: |
          npm i --no-save playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node scripts/cacar-logos-navegador.mjs
        continue-on-error: true

      - name: Commitar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logos-marcas-v2.json logos-extra || true
          git commit -m "chore(logos): resultado do exportador de logos v2" || echo "sem mudanças"
          git push
