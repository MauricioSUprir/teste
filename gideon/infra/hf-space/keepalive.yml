# Copiar para .github/workflows/ no repositório do GIDEON.
# Abre o n8n a cada 6 horas para o Space do Hugging Face não dormir (grátis).
name: GIDEON - manter n8n acordado
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Abrir /healthz
        run: curl -fsS --max-time 120 https://gui210113-gideon-n8n.hf.space/healthz
